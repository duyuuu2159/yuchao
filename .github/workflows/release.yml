# 推送 v* 标签时发布：检查 → 打包 exe → 试运行 → 生成校验和与构建来源证明 → 创建 GitHub Release。
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# 发布说明取自 CHANGELOG.md 里对应版本的那一节；标签和 package.json 的版本号不一致时直接失败。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 创建 Release
  id-token: write # 构建来源证明需要
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: 版本号和更新日志
        shell: bash
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - name: 全部检查
        run: npm run check

      - name: 打包
        run: npm run build:exe

      - name: 试运行
        shell: bash
        run: |
          ./dist/yuchao.exe --version | grep -F "yuchao ${GITHUB_REF_NAME#v} "
          export USERPROFILE="$RUNNER_TEMP/home" YUCHAO_DB="$RUNNER_TEMP/home/index.db"
          mkdir -p "$USERPROFILE"
          ./dist/yuchao.exe index
          ./dist/yuchao.exe stats

      - name: 校验和
        shell: bash
        run: |
          cd dist
          mv yuchao.exe "yuchao-${GITHUB_REF_NAME}-windows-x64.exe"
          sha256sum "yuchao-${GITHUB_REF_NAME}-windows-x64.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 用户可以用 `gh attestation verify <文件> --repo duyuuu2159/yuchao` 确认 exe 是这个仓库的 CI 构建的
      - name: 构建来源证明
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/yuchao-*.exe

      - name: 创建 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "鱼巢 ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist/yuchao-*.exe dist/SHA256SUMS.txt
